# AEC para MEXA - cancela por software el sonido que sale por el parlante
# antes de que llegue al reconocedor de voz. Sin esto MEXA se oye a si misma
# y no puede ser interrumpida mientras habla (barge-in).
#
# INSTALACION (este archivo es la copia autoritativa; la que lee PipeWire va
# en el home del usuario):
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp config/pipewire/99-mexa-aec.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire
# Para desactivarlo: borrar la copia del home y reiniciar pipewire.
#
# monitor.mode = true : la senal de referencia se toma del MONITOR del sink
# POR DEFECTO. Por eso NO hay que redirigir pw-play (TTS) ni cvlc (video):
# esos dos tampoco eligen destino, van al sink por defecto igual que la
# referencia. Los dos lados siguen al mismo dispositivo por construccion, y
# modulo_tts.py / modulo_proyector.py no se tocan.
#
# CUIDADO - ESTA CONFIG NO SE VERIFICA SOLA. Dos maneras de romperse en
# silencio, las dos vistas en hardware el 2026-08-27:
#
#   1. CARRERA DE ARRANQUE. Este modulo carga junto con el daemon, ANTES de
#      que los dispositivos esten publicados. Si el iTalk-02 todavia no
#      existe, target.object no encuentra a quien apuntar y WirePlumber
#      engancha la captura al dispositivo por defecto de ese instante. El
#      nodo mexa_aec_source entrega CEROS: sordera total sin un solo error.
#   2. CAMBIO DE SINK POR DEFECTO. Si se conecta o se cae un parlante, la
#      referencia se muda con el default y el AEC resta un sonido que nadie
#      esta escuchando.
#
# Antes de confiar en el AEC, correr `python3 tests/calibrar_aec.py`: revisa
# los dos cables, ofrece reconectarlos, y recien despues mide.
#
# Los filtros extra de WebRTC van APAGADOS a proposito: MEXA deriva su umbral
# de voz del piso de ruido MEDIDO (modulos/vad.py). Un supresor de ruido o un
# control de ganancia moviendo ese piso por debajo romperia esa calibracion.
# Aca queremos cancelacion de eco y nada mas.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            monitor.mode = true
            library.name = aec/libspa-aec-webrtc
            aec.args = {
                webrtc.gain_control          = false
                webrtc.noise_suppression     = false
                webrtc.transient_suppression = false
                webrtc.voice_detection       = false
                webrtc.high_pass_filter      = false
            }
            capture.props = {
                node.name      = "mexa_aec_capture"
                target.object  = "alsa_input.usb-Clip-on_USB_microphone_iTalk-02-00.mono-fallback"
                audio.channels = 1
            }
            source.props = {
                node.name        = "mexa_aec_source"
                node.description = "MEXA microfono sin eco"
                audio.channels   = 1
            }
        }
    }
]
